# sync-sha: 732c40c982e5dbfd2160131c1a1f226d5b8ea4f2453a9291182deed4c68530f6
name: Security scanners

# Static/security scanners gate on every PR/push — flawfinder (gate on >=4),
# clang-tidy (cert-*, security.*) and semgrep over src/. Same job as the
# monthly ci-deep.yml scanners run.
#
# Action pin (keep in sync with build-test.yml):
# actions/checkout@v5.1.0        -> fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
# actions/upload-artifact@v5.0.0 -> 330a01c490aca151604b8cf639adc76d48f6c5d4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned so a scanner release cannot silently change the gate.
  SEMGREP_VERSION: "1.184.0"

on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: security-scanners-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scanners:
    name: Security scanners
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout module
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: true
      - name: Load version pins
        run: bash .github/scripts/load-versions.sh
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flawfinder clang-tidy bear python3 python3-pip pipx curl \
            build-essential libpcre2-dev zlib1g-dev
          # semgrep: isolate via pipx (PEP 668 blocks a bare pip3 install into
          # the system Python on the Ubuntu 24.04 self-hosted runner).
          if command -v pipx >/dev/null; then
            pipx install --quiet "semgrep==${SEMGREP_VERSION}"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            pip3 install --quiet --user --break-system-packages \
              "semgrep==${SEMGREP_VERSION}"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Restore module build cache
        uses: $/.github/actions/build-cache
        with:
          mode: module
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Build module and capture real compile flags
        run: |
          set -euo pipefail
          build="$GITHUB_WORKSPACE/.build/nginx-${NGINX_VERSION}-module"
          if [ -d "$build/objs/addon" ]; then
            find "$build/objs/addon" -type f -name '*.o' -delete
          fi
          rm -f "$build"/objs/*.so
          bear --output compile_commands.json -- \
            bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" module

      - name: Verify compilation database coverage
        env:
          WS: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(os.environ["WS"])
          want = {p.resolve() for p in (root / "src").glob("*.c")}
          db = json.loads((root / "compile_commands.json").read_text())
          got = {pathlib.Path(e["file"]).resolve() for e in db}
          missing = want - got
          if not want or missing:
              sys.exit("compile database missing: " + ", ".join(sorted(p.name for p in missing)))
          print(f"compile database covers {len(want)} source files")
          PY
      - name: flawfinder (gate on >=4)
        run: bash ci/tools/flawfinder-gate.sh
      - name: clang-tidy (cert-*, security.*)
        run: |
          set -euo pipefail
          status=0
          for src in "$GITHUB_WORKSPACE"/src/*.c; do
            echo "--- clang-tidy: $(basename "$src") ---"
            clang-tidy "$src" -p "$GITHUB_WORKSPACE" \
              2>&1 | tee -a clang-tidy.log || status=1
          done
          exit "$status"
      - name: gcc -fanalyzer (advisory)
        continue-on-error: true
        run: |
          python3 ci/tests/test_fanalyzer_args.py -v
          bash ci/tools/fanalyzer.sh "$GITHUB_WORKSPACE"
      - name: semgrep (gate)
        run: |
          # --error makes a finding a non-zero exit; without it (and with the
          # old `|| true`) both findings and a scanner crash produced a green
          # job, so the advertised gate could not fail. set -o pipefail keeps
          # `tee` from swallowing that status.
          set -euo pipefail
          semgrep scan --error --config p/c --config p/security-audit \
            --jobs=1 --metrics=off \
            "$GITHUB_WORKSPACE/src/" 2>&1 | tee semgrep.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: security-reports
          path: |
            ${{ github.workspace }}/flawfinder.log
            ${{ github.workspace }}/clang-tidy.log
            ${{ github.workspace }}/fanalyzer.log
            ${{ github.workspace }}/semgrep.log
          retention-days: 14
