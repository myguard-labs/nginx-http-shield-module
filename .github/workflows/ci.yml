# Single entry point for the PR CI suite. This is the ONLY workflow with a
# `pull_request:` trigger — the member workflows are reachable on a PR solely
# as `workflow_call:` jobs from here, so each runs exactly once. Adding a
# `pull_request:` to a member would resurrect the double-run; add the job here
# instead.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: orchestrator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build&Test
    uses: ./.github/workflows/build-test.yml
    permissions:
      contents: read

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  fuzzing:
    name: Fuzzing
    uses: ./.github/workflows/fuzzing.yml
    permissions:
      contents: read

  valgrind:
    name: Valgrind
    uses: ./.github/workflows/valgrind.yml
    permissions:
      contents: read

  asan-soak:
    name: ASan soak
    uses: ./.github/workflows/asan.yml
    permissions:
      contents: read

  security-scanners:
    name: Security scanners
    uses: ./.github/workflows/security-scanners.yml
    permissions:
      contents: read

  # codeql.yml groups on `codeql-${{ github.ref }}`, with no github.workflow
  # component, and a called workflow inherits the caller's github.ref. That used
  # to make the called copy cancel its standalone `pull_request:` twin; with the
  # member trigger removed there is only one copy on a PR and nothing to cancel.
  # Restoring a `pull_request:` on codeql.yml would bring the cancellation back.
  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write  # CodeQL uploads its SARIF to code scanning
      actions: read  # the CodeQL action reads run metadata to attribute results
