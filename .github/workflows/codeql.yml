# sync-sha: 682d308ab0b5bfbd20f39da28965e6dd71750c2166f80ae25f47ca6a9551aee2
name: CodeQL

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Monthly, day 4 @ 04:47 UTC (staggered per repo like ci-deep).
    - cron: "47 4 4 * *"
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Required by github/codeql-action/upload-sarif to publish results to the
      # repo's Code Scanning tab (Security > Code scanning alerts); without it
      # the analysis runs but the SARIF upload step fails with 403.
      security-events: write # needed for github/codeql-action/upload-sarif (see comment above)
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: true

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libpcre2-dev zlib1g-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          queries: security-extended
          # No paths/paths-ignore here on purpose: for compiled languages CodeQL
          # populates the database from whatever the traced build compiles, and
          # those filters are silently ignored. Scope is instead enforced by the
          # build itself -- `module` mode compiles only our .so, never the nginx
          # core -- so upstream nginx sources never enter the database.

      # CI-7: reuse the downloaded nginx tarball across runs.
      - name: Restore build cache (ccache + source + build tree)
        uses: $/.github/actions/build-cache
        with:
          mode: module
          nginx-version: ${{ env.NGINX_VERSION }}

      # NO_CACHE=1: CodeQL's tracer only sees a compile that actually invokes
      # the compiler. ccache serves a hit without running cc, so a warm cache
      # silently produces a database CodeQL can't populate -- "no source seen
      # during build" -- while the build itself looks fine. Tracing needs a
      # real compile every run; ccache and the CodeQL job are incompatible.
      - name: Build traced source (module only)
        run: NO_CACHE=1 bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" module

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:c-cpp
