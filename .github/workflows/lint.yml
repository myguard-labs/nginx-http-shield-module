name: Lint

on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ci/linter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          submodules: true

      - name: Install linters
        run: bash ci/linter/install-linters.sh

      - name: Run ci/linter/ gate
        run: bash ci/linter/run-all.sh

      - name: Run ci/linter/ selftest
        run: bash ci/linter/selftest.sh
