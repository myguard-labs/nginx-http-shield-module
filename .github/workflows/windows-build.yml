# sync-sha: df15e406153b08b1ee9792905a64c53b29c312694ea3a80d9dcc1089238aabdd
name: Windows build

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'config'
      - '.github/versions.env'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch: {}

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PCRE_VERSION: '10.44'
  PCRE_SHA256: '86b9cb0aa3bcb7994faa88018292bc704cdbb708e785f7c74352ff6ea7d3175b'
  ZLIB_VERSION: '1.3.1'
  ZLIB_SHA256: '9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23'

jobs:
  msvc:
    name: MSVC x64 static build and runtime
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Load pinned nginx version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content .github/versions.env |
            Where-Object { $_ -match '^(NGINX_VERSION|NGINX_VERSION_SHA256)=' } |
            ForEach-Object { $_ >> $env:GITHUB_ENV }
      - name: Fetch and verify sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sources = @(
            @{ name = "nginx-$env:NGINX_VERSION"
               url = "https://nginx.org/download/nginx-$env:NGINX_VERSION.tar.gz"
               sha = $env:NGINX_VERSION_SHA256 },
            @{ name = "pcre2-$env:PCRE_VERSION"
               url = ('https://github.com/PCRE2Project/pcre2/releases/download/' +
                 "pcre2-$env:PCRE_VERSION/pcre2-$env:PCRE_VERSION.tar.gz")
               sha = $env:PCRE_SHA256 },
            @{ name = "zlib-$env:ZLIB_VERSION"
               url = "https://github.com/madler/zlib/releases/download/v$env:ZLIB_VERSION/zlib-$env:ZLIB_VERSION.tar.gz"
               sha = $env:ZLIB_SHA256 }
          )
          foreach ($source in $sources) {
            $archive = "$($source.name).tar.gz"
            Invoke-WebRequest -Uri $source.url -OutFile $archive `
              -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 60
            $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $source.sha.ToLower()) { throw "sha256 mismatch for $archive" }
            tar -xzf $archive
            if ($LASTEXITCODE -ne 0) { throw "tar failed for $archive" }
          }
      - name: Locate MSVC environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $root = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $root) { throw 'Visual C++ toolchain not found' }
          $vcvars = "$root\VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          "VCVARS=$vcvars" >> $env:GITHUB_ENV
      - name: Configure static module
        shell: bash
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          set -euo pipefail
          module_dir=$(cygpath -w "$GITHUB_WORKSPACE")
          module_dir=${module_dir//\\//}
          ./configure \
            --with-cc=cl --builddir=objs --prefix= \
            --conf-path=conf/nginx.conf --pid-path=logs/nginx.pid \
            --http-log-path=logs/access.log --error-log-path=logs/error.log \
            --sbin-path=nginx.exe \
            --http-client-body-temp-path=temp/client_body_temp \
            --http-proxy-temp-path=temp/proxy_temp \
            --http-fastcgi-temp-path=temp/fastcgi_temp \
            --with-cc-opt="-DFD_SETSIZE=1024 -MT /utf-8 /Zc:preprocessor" \
            --with-pcre="$module_dir/pcre2-${PCRE_VERSION}" \
            --with-zlib="$module_dir/zlib-${ZLIB_VERSION}" \
            --add-module="$module_dir"
      - name: Pre-build PCRE2 and zlib
        shell: cmd # zizmor: ignore[misfeature]
        run: |
          call "%VCVARS%" || exit /b 1
          cd pcre2-%PCRE_VERSION% || exit /b 1
          copy /y src\config.h.generic src\config.h || exit /b 1
          copy /y src\pcre2.h.generic src\pcre2.h || exit /b 1
          copy /y src\pcre2_chartables.c.dist src\pcre2_chartables.c || exit /b 1
          cl -c -O2 -MT -DHAVE_CONFIG_H -DPCRE2_CODE_UNIT_WIDTH=8 -DPCRE2_STATIC -Isrc ^
            src\pcre2_auto_possess.c src\pcre2_chartables.c src\pcre2_compile.c ^
            src\pcre2_config.c src\pcre2_context.c src\pcre2_convert.c ^
            src\pcre2_dfa_match.c src\pcre2_error.c src\pcre2_extuni.c ^
            src\pcre2_find_bracket.c src\pcre2_maketables.c src\pcre2_match.c ^
            src\pcre2_match_data.c src\pcre2_newline.c src\pcre2_ord2utf.c ^
            src\pcre2_pattern_info.c src\pcre2_script_run.c src\pcre2_serialize.c ^
            src\pcre2_string_utils.c src\pcre2_study.c src\pcre2_substitute.c ^
            src\pcre2_substring.c src\pcre2_tables.c src\pcre2_ucd.c ^
            src\pcre2_valid_utf.c src\pcre2_xclass.c || exit /b 1
          link -lib -out:pcre2-8.lib *.obj || exit /b 1
          cd ..\zlib-%ZLIB_VERSION% || exit /b 1
          cl -c -O2 -MT adler32.c crc32.c deflate.c infback.c inffast.c ^
            inflate.c inftrees.c trees.c zutil.c compress.c uncompr.c gzclose.c ^
            gzlib.c gzread.c gzwrite.c || exit /b 1
          link -lib -out:zlib.lib *.obj || exit /b 1
      - name: Build
        shell: cmd # zizmor: ignore[misfeature]
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          call "%VCVARS%" || exit /b 1
          nmake -f objs/Makefile || exit /b 1
      - name: Verify static registration and directives
        shell: pwsh
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path objs\nginx.exe)) { throw 'nginx.exe missing' }
          if (-not (Test-Path objs\addon\src\ngx_http_shield_module.obj)) { throw 'module object missing' }
          $modules = Get-Content objs\ngx_modules.c -Raw
          if ($modules -notmatch 'ngx_http_shield_module') {
            throw 'module absent from static module table'
          }
          New-Item -ItemType Directory -Force -Path conf, logs, temp, html | Out-Null
          function Write-Conf([string]$directive) {
            @('events { worker_connections 64; }', 'http {', ' server {',
              '  listen 127.0.0.1:18099;', '  location / {',
              "   $directive", '  }', ' }', '}') |
              Set-Content -Encoding ascii conf/nginx.conf
          }
          function Test-Config {
            $old = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try { & .\objs\nginx.exe -p . -c conf/nginx.conf -t 2>&1 | Out-String | Write-Host; return $LASTEXITCODE }
            finally { $ErrorActionPreference = $old }
          }
          Write-Conf 'shield block;'
          if ((Test-Config) -ne 0) { throw 'valid shield directive rejected' }
          Write-Conf 'shield_NOT_A_DIRECTIVE on;'
          if ((Test-Config) -eq 0) { throw 'bogus directive accepted' }
          exit 0
      - name: Runtime request filtering
        shell: pwsh
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          'ok' | Set-Content -Encoding ascii html/index.html
          @('events { worker_connections 64; }', 'http {', ' server {',
            '  listen 127.0.0.1:18099;',
            '  location / { shield block; root html; }', ' }', '}') |
            Set-Content -Encoding ascii conf/nginx.conf
          $nginx = Start-Process -FilePath .\objs\nginx.exe `
            -ArgumentList '-p', '.', '-c', 'conf/nginx.conf' -PassThru
          try {
            $client = [System.Net.Http.HttpClient]::new()
            $ready = $false
            foreach ($attempt in 1..30) {
              try {
                $response = $client.GetAsync('http://127.0.0.1:18099/').Result
                if ([int]$response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 200
            }
            if (-not $ready) { throw 'nginx did not become ready' }
            $attack = $client.GetAsync(
              'http://127.0.0.1:18099/?q=%27%20or%201%3D1--').Result
            $status = [int]$attack.StatusCode
            if ($status -ne 403) { throw "attack request returned $status, want 403" }
          } finally {
            & .\objs\nginx.exe -p . -c conf/nginx.conf -s stop
            $nginx.WaitForExit(5000) | Out-Null
          }
      - name: Dump diagnostics on failure
        if: failure()
        shell: pwsh
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          foreach ($file in 'objs/autoconf.err', 'objs/Makefile', 'logs/error.log') {
            if (Test-Path $file) { Get-Content $file -Tail 100 }
          }

  mingw:
    name: MinGW-w64 x64 dynamic build and runtime
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            perl
      - name: Load pinned nginx version
        shell: msys2 {0}
        run: |
          set -euo pipefail
          grep -E '^(NGINX_VERSION|NGINX_VERSION_SHA256)=' .github/versions.env >> "$GITHUB_ENV"
      - name: Fetch and verify sources
        shell: msys2 {0}
        run: |
          set -euo pipefail
          fetch() { curl -fsSL -o "$2" "$1"; echo "$3  $2" | sha256sum -c -; tar -xzf "$2"; }
          fetch "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz" \
            "nginx-${NGINX_VERSION}.tar.gz" "$NGINX_VERSION_SHA256"
          pcre_url="https://github.com/PCRE2Project/pcre2/releases/download"
          fetch "${pcre_url}/pcre2-${PCRE_VERSION}/pcre2-${PCRE_VERSION}.tar.gz" \
            "pcre2-${PCRE_VERSION}.tar.gz" "$PCRE_SHA256"
          fetch "https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz" \
            "zlib-${ZLIB_VERSION}.tar.gz" "$ZLIB_SHA256"
      - name: Configure dynamic module
        shell: msys2 {0}
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          set -euo pipefail
          ./configure \
            --with-cc=gcc --builddir=objs --prefix= \
            --conf-path=conf/nginx.conf --pid-path=logs/nginx.pid \
            --http-log-path=logs/access.log --error-log-path=logs/error.log \
            --sbin-path=nginx.exe \
            --http-client-body-temp-path=temp/client_body_temp \
            --http-proxy-temp-path=temp/proxy_temp \
            --http-fastcgi-temp-path=temp/fastcgi_temp \
            --with-cc-opt="-DFD_SETSIZE=1024" \
            --with-pcre="$(pwd)/../pcre2-${PCRE_VERSION}" \
            --with-zlib="$(pwd)/../zlib-${ZLIB_VERSION}" \
            --add-dynamic-module="$(pwd)/.."
      - name: Build
        shell: msys2 {0}
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          set -euo pipefail
          make
      - name: Verify dynamic module, directives, and runtime
        shell: msys2 {0}
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          set -euo pipefail
          test -f objs/nginx.exe
          test -f objs/ngx_http_shield_module.so
          mkdir -p conf logs temp html
          printf 'ok\n' > html/index.html
          write_conf() {
            cat > conf/nginx.conf <<EOF
          load_module objs/ngx_http_shield_module.so;
          events { worker_connections 64; }
          http { server { listen 127.0.0.1:18100; location / { $1 } } }
          EOF
          }
          write_conf 'shield block; root html;'
          ./objs/nginx.exe -p . -c conf/nginx.conf -t
          write_conf 'shield_NOT_A_DIRECTIVE on;'
          if ./objs/nginx.exe -p . -c conf/nginx.conf -t 2>&1; then
            echo 'negative control passed: bogus directive accepted'; exit 1
          fi
          write_conf 'shield block; root html;'
          ./objs/nginx.exe -p . -c conf/nginx.conf &
          nginx_pid=$!
          trap './objs/nginx.exe -p . -c conf/nginx.conf -s stop || true; wait "$nginx_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            [ "$(curl.exe -s -o NUL -w '%{http_code}' http://127.0.0.1:18100/)" = 200 ] && break
            sleep 0.2
          done
          [ "$(curl.exe -s -o NUL -w '%{http_code}' http://127.0.0.1:18100/)" = 200 ]
          code=$(curl.exe -s -o NUL -w '%{http_code}' 'http://127.0.0.1:18100/?q=%27%20or%201%3D1--')
          [ "$code" = 403 ] || { echo "attack request returned $code, want 403"; exit 1; }
      - name: Dump diagnostics on failure
        if: failure()
        shell: msys2 {0}
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          for file in objs/autoconf.err objs/Makefile logs/error.log; do
            [ ! -f "$file" ] || { echo "===== $file ====="; tail -100 "$file"; }
          done
