# Include in every PHP location after the php-boundary recipe's guards/params.
# Replace php-boundary's fastcgi_pass; do not add a second fastcgi_pass.
fastcgi_pass unix:/run/shield-handoff/guard.sock;
fastcgi_keep_conn off;
# This exact ordered vector must match site-contract.json for the final script.
fastcgi_param PHP_ADMIN_VALUE "open_basedir=/srv/shield-site\nmemory_limit=128M";
