# Include as the entire FastCGI handler, after location rewrites, in every
# FastCGI location (including named/internal/error handlers). No later rewrite.
if ($shield_php_nonexec) { return 403; }
if ($shield_php_allowed = 0) { return 404; }
include /etc/nginx/shield-php-boundary/params.conf;
fastcgi_pass shield_php_backend;
