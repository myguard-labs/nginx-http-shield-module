# Include once in http {}; adapt every /srv/shield-site path together.
# Regex keys are deliberately case-sensitive (literal map keys are not).
# Use true end anchors: $ also matches before a terminal decoded newline.
map $uri $shield_php_script {
    volatile;
    default "";
    ~^/index[.]php(?:/|\z) /srv/shield-site/app/index.php;
    ~^/health[.]php\z /srv/shield-site/app/health.php;
}
map $uri $shield_php_name {
    volatile;
    default "";
    ~^/index[.]php(?:/|\z) /index.php;
    ~^/health[.]php\z /health.php;
}
map $uri $shield_php_path_info {
    volatile;
    default "";
    ~^/index[.]php(?<shield_php_info>/(?s:.*))\z $shield_php_info;
}
# This independent allowlist constrains the exact value sent to FastCGI.
map $shield_php_script $shield_php_allowed {
    volatile;
    default 0;
    ~^/srv/shield-site/app/(?:index|health)[.]php\z 1;
}
# Deny whole filesystem trees, even if accidentally added to the allowlist.
map $shield_php_script $shield_php_nonexec {
    volatile;
    default 0;
    ~^/srv/shield-site/(?:uploads|cache|media)(?:/|$) 1;
}
