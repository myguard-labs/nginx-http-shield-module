# Include inside the site's server {}, after adapting paths and maps.conf.
root /srv/shield-site/public;
index index.html;
location = / { rewrite ^ /index.php last; }
location / {
    try_files $uri $uri/ /index.php$is_args$args;
}
# Ordinary public data stays readable. Do not add ^~: PHP suffixes must reach
# the guarded handler instead of being disclosed as static source.
location /uploads/ { alias /srv/shield-site/uploads/; }
location /media/ { alias /srv/shield-site/media/; }
location ~* [.]php(?:/|$) {
    include /etc/nginx/shield-php-boundary/dispatch.conf;
}
