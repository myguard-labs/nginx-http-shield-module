worker_processes 1;
events { worker_connections 32; }
http {
    shield block;
    shield_skip xss;
    server {
        listen 8080;
        root /srv/site/public;
        open_file_cache off;
        disable_symlinks off;
        location / { try_files $uri $uri/ /index.php; }
        location /ops/ { internal; stub_status; }
        location /downloads/ { alias /srv/site/private/; }
        location = /index.php {
            fastcgi_param SCRIPT_FILENAME /srv/site/app/index.php;
            fastcgi_param PHP_ADMIN_VALUE "memory_limit=128M";
            fastcgi_pass unix:/run/shield/guard.sock;
            fastcgi_keep_conn off;
        }
    }
}
